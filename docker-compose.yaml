services:
  mail-mgr:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - mail-mgr-data:/data
    environment:
      - IMAP_PASSWORD=${IMAP_PASSWORD}
      - WEB_AUTH_USER=${WEB_AUTH_USER}
      - WEB_AUTH_PASS=${WEB_AUTH_PASS}
      - DATA_PATH=/data
    restart: unless-stopped

volumes:
  mail-mgr-data:
